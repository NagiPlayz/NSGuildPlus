# NSGuildPlus 1.0 - main configuration
message-format: LEGACY_AMPERSAND   # LEGACY_AMPERSAND | LEGACY_SECTION | MINIMESSAGE | AUTO
language: en                       # optional extra file lang/<code>.yml overrides lang.yml

guild:
  max-members: 50
  auto-promote-oldest-member: true
  # Level 1 is the start. A guild reaches the level when its total Power Score is at least the number.
  level-thresholds: {2: 1000, 3: 5000, 4: 15000, 5: 30000, 6: 50000}
  power-factors:
    kills: 10
    deaths: -5
    money: 0.001
    achievements: 25
  stars:
    kills: 5
    deaths: -2
    achievements: 10
    notify: true

ranks:
  1: {name: "Sovereign / Mythic", score: 10000, description: "Ultimate Guild Legend"}
  2: {name: "Titan / Conqueror", score: 4000, description: "Heavy power and high earner"}
  3: {name: "Gladiator / Warlord", score: 1500, description: "Experienced PvP and active earner"}
  4: {name: "Vanguard / Slayer", score: 500, description: "Frontline fighter"}
  5: {name: "Recruit / Novice", score: 0, description: "New member"}

leaderboard:
  annual-cycle-days: 365

hideout:
  enabled: true
  max-hideouts-per-guild: 3
  scale-with-guild-level:
    enabled: true
    levels: {1: 1, 3: 2, 5: 3}
  who-can-teleport: MEMBER        # MEMBER, VICE_CAPTAIN, CAPTAIN
  name:
    min-length: 3
    max-length: 16
    regex: "^[a-zA-Z0-9_]+$"
  teleport:
    delay-seconds: 3
    cooldown-seconds: 60
    cancel-on-move: true
    cancel-on-damage: true
    cancel-on-combat: true
    cancel-on-inventory-open: true
    combat-seconds: 15
    cost: 0.0
    safe-teleport: true
    allow-cross-world: true
    disabled-worlds: ["world_the_end"]
    bypass-permission: "nsguildplus.hideout.bypass"
  effects:
    countdown-display: TITLE      # TITLE, ACTIONBAR, CHAT, BOSSBAR, NONE
    countdown-sound: "BLOCK_NOTE_BLOCK_PLING"
    teleport-sound: "ENTITY_ENDERMAN_TELEPORT"
    teleport-particle: "PORTAL"
  gui:
    size: 36
    item-material: "RED_BED"
    set-button-material: "NETHER_STAR"

settings:
  who-can-change: CAPTAIN
  name:
    min-length: 3
    max-length: 12
    regex: "^[a-zA-Z0-9_]+$"
    allow-colours: false
    free-changes: 1            # first change free after guild creation
    cost: 500                  # Guild Stars taken from the guild from the 2nd change on
    cancel-word: "cancel"
    input-timeout-seconds: 30
  colour:
    slots-per-page: 27
  friendly-fire:
    default: false
    who-can-toggle: CAPTAIN

